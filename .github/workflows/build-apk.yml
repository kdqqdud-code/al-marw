name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project if needed
        run: |
          if [ -f Al-Marw-project.zip ]; then
            unzip -o Al-Marw-project.zip
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk al-marw.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest al-marw.apk --title "Al-Marw" --notes "آخر نسخة"
